<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decupador de Mídia - Projeto ALIM</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="clipper-layout">
    <!-- Cabeçalho do Decupador -->
    <div class="panel-toolbar" style="padding: 10px 16px;">
      <div class="session-heading">
        <h2 id="clipperMediaTitle">Carregando mídia...</h2>
        <span id="clipperSessionInfo">Sessão: -</span>
      </div>
      <div class="shortcut-hints">
        <span><kbd>Espaço</kbd> Play/Pause</span>
        <span><kbd>I</kbd> Marcar IN</span>
        <span><kbd>O</kbd> Marcar OUT</span>
      </div>
    </div>

    <!-- Player HTML5 no Topo (suporta streaming via protocolo media:// com Range) -->
    <div class="player-wrapper">
      <video id="mediaPlayer" controls preload="metadata"></video>
    </div>

    <!-- Base: Marcação de Tempo (IN / OUT) e Envio para a Fila -->
    <div class="clipper-controls-card">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; gap: 8px; align-items: center;">
          <button type="button" id="btnPlayPause" class="btn btn-outline">
            &#9654; Play / Pause
          </button>
          <button type="button" id="btnMarkIn" class="btn btn-primary">
            [ I ] Marcar IN no Tempo Atual
          </button>
          <button type="button" id="btnMarkOut" class="btn btn-primary">
            [ O ] Marcar OUT no Tempo Atual
          </button>
        </div>
        <div style="font-family: Consolas, monospace; font-size: 13px; color: var(--text-secondary);">
          Posição Atual: <strong id="currentTimeDisplay" style="color: #fff;">00:00:00.000</strong>
        </div>
      </div>

      <div class="clipper-time-grid">
        <div class="form-group">
          <label class="form-label">
            Tempo Inicial (IN) <span class="dc-tag">HH:MM:SS.mmm ou seg</span>
          </label>
          <input
            type="text"
            id="inputStartTime"
            class="form-control"
            placeholder="00:00:00.000"
          />
        </div>

        <div class="form-group">
          <label class="form-label">
            Tempo Final (OUT) <span class="dc-tag">HH:MM:SS.mmm ou seg</span>
          </label>
          <input
            type="text"
            id="inputEndTime"
            class="form-control"
            placeholder="00:00:10.000"
          />
        </div>

        <div class="form-group">
          <label class="form-label">
            Identificador / Rótulo do Recorte (Opcional)
          </label>
          <input
            type="text"
            id="inputCutLabel"
            class="form-control"
            placeholder="Ex: narrativa_parte1"
          />
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 4px;">
        <span id="clipperFeedback" style="font-size: 12px; color: var(--text-secondary);">
          Marque os pontos IN e OUT pela timeline ou digite manualmente e adicione à fila.
        </span>
        <div style="display: flex; gap: 8px;">
          <button type="button" id="btnClearMarkers" class="btn btn-outline">
            Limpar Marcações
          </button>
          <button type="button" id="btnAddToQueue" class="btn btn-success">
            &#10010; Adicionar à Fila de Corte
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="clipper.js"></script>
</body>
</html>
